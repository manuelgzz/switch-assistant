name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test MQTT protocol and discovery
        run: |
          set -euo pipefail
          python3 scripts/generate-title-index.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          gcc -Wall -Wextra -Werror -fsanitize=address,undefined -pthread -Iinclude tests/mqtt_wire_test.c -o /tmp/mqtt-wire-test
          /tmp/mqtt-wire-test
          gcc -Wall -Wextra -Werror -fsanitize=address,undefined -Itests/stubs -Iinclude source/audio_control.c tests/audio_control_test.c -o /tmp/audio-control-test
          /tmp/audio-control-test
          gcc -Wall -Wextra -Werror -fsanitize=address,undefined -Itests/stubs -Iinclude source/game_query.c tests/game_query_test.c -o /tmp/game-query-test
          /tmp/game-query-test
          gcc -Wall -Wextra -Werror -fsanitize=address,undefined -Itests/stubs -Iinclude tests/runtime_version_test.c -o /tmp/runtime-version-test
          /tmp/runtime-version-test

      - name: Build NRO
        run: |
          set -euo pipefail
          docker pull devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
          docker run --rm -v "$PWD:/workspace" -w /workspace/sysmodule devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282 /bin/bash -lc "make install-layout"
          docker run --rm -v "$PWD:/workspace" -w /workspace/overlay devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282 /bin/bash -lc "make"
          docker run --rm -v "$PWD:/workspace" -w /workspace/overlay-loader devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282 /bin/bash -lc "make install-layout"
          mkdir -p romfs/sysmodule
          cp sysmodule/atmosphere/contents/00FF000053484101/exefs.nsp romfs/sysmodule/exefs.nsp
          : > romfs/sysmodule/boot2.flag
          mkdir -p romfs/overlay-loader
          cp overlay-loader/atmosphere/contents/00FF000053484102/exefs.nsp romfs/overlay-loader/exefs.nsp
          : > romfs/overlay-loader/boot2.flag
          mkdir -p romfs/overlay
          cp overlay/switch-ha-overlay.ovl romfs/overlay/switch-ha-overlay.ovl
          rm -rf build switch-ha.elf switch-ha.nro
          docker run --rm -v "$PWD:/workspace" -w /workspace devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282 /bin/bash -lc "make"

      - name: Upload build artifact
        id: nro_artifact
        uses: actions/upload-artifact@v4
        with:
          name: switch-ha-${{ github.sha }}
          path: switch-ha.nro
          if-no-files-found: error
          retention-days: 30

      - name: Link downloadable NRO in build summary
        env:
          ARTIFACT_URL: ${{ steps.nro_artifact.outputs.artifact-url }}
        run: |
          echo "### Switch Assistant build" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the artifact ZIP, then extract switch-ha.nro:" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download NRO artifact]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format="%(contents)" > RELEASE_NOTES.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: switch-ha.nro
